[package]
name = "nullframe"
version = "0.1.0"
edition = "2024"
description = "A music visualizer for creating social media visuals"
license = "MIT OR Apache-2.0"
build = "build.rs"

[workspace]
members = [".", "installer"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "flac", "mp3", "vorbis", "wav"] }
rustfft = "6.4.1"
image = "0.25"

[dev-dependencies]
pollster = "0.4"

[profile.release]
lto = "thin"
strip = true
