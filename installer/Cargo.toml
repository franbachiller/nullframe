[package]
name = "nullframe-setup"
version = "0.1.0"
edition = "2024"
description = "Instalador de Nullframe"
license = "MIT OR Apache-2.0"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "wgpu"] }
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17.2"
